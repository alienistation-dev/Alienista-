<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · Alienista</title>
<style>
  :root { --ink: #080808; --muted: #383830; --green: #1A3822; --paper: #ffffff; --line: #d9ddd6; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--paper); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 26rem; border-top: 4px solid var(--green); padding-top: 20px; }
  h1 { margin: 0 0 8px; font-size: 1.25rem; }
  p { margin: 0 0 12px; color: var(--muted); }
  button { margin-top: 8px; padding: 10px 16px; border: 0; border-radius: 6px; background: var(--green); color: var(--paper);
    font: inherit; font-weight: 600; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <h1>You are offline</h1>
  <p>This page needs a connection. A scanner page that is already open keeps working.</p>
  <p>Scans taken offline are saved on this device and sync when the connection returns.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
